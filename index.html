        .calendar-day.selected { border: 2px solid #556B2F; background-color: #F0F5F3; } /* Updated border color */

        /* Jar of Goodness Loader Animation */
        @keyframes fall {
            0% { transform: translateY(-20px); opacity: 1; }
            100% { transform: translateY(120px); opacity: 0; }

        .falling-herbs .herb1 { animation: fall 2s infinite ease-in; }
        .falling-herbs .herb2 { animation: fall 2.5s infinite ease-in; animation-delay: 0.5s; }

        // --- UTILITY FUNCTIONS ---
        const getStartOfWeek = (date) => {
            const d = new Date(date);
            d.setHours(0, 0, 0, 0);
            const day = d.getDay();
            const diff = d.getDate() - day + (day === 0 ? -6 : 1);
            return new Date(d.setDate(diff));
        };

        // --- CUSTOM HOOKS ---
        function useDebounce(value, delay) {
            const [debouncedValue, setDebouncedValue] = useState(value);
            useEffect(() => {
                const handler = setTimeout(() => {
                    setDebouncedValue(value);
                }, delay);
                return () => {
                    clearTimeout(handler);
                };
            }, [value, delay]);
            return debouncedValue;
        }

        // --- NEW LOADING INDICATOR COMPONENT ---
        const LoadingIndicator = () => (
            <div className="flex flex-col justify-center items-center h-screen bg-earth-light">
                <svg width="150" height="200" viewBox="0 0 150 200" className="mb-4">
                    <path d="M30 70 Q 25 70 25 75 L 25 180 Q 25 190 35 190 L 115 190 Q 125 190 125 180 L 125 75 Q 125 70 120 70 Z" fill="#FFFFFF" stroke="#3D5247" strokeWidth="2" />

        const FoodExamplesModal = ({ nutrient, onClose }) => {

        const BuyNowButton = ({ product, userData, children, className }) => {
            const [isLoading, setIsLoading] = useState(false);

            const displayRazorpay = () => {
                setIsLoading(true);
                const options = {
                    key: "rzp_live_7nDxzwAHPdCftz", // IMPORTANT: Replace with your key ID from Razorpay Dashboard
                    amount: product.price * 100, // Amount in paise
                    currency: "INR",
                    name: "Goodness of Earth",
                    description: product.name,
                    image: product.image,
                    handler: function (response) {
                        alert("Payment successful! Payment ID: " + response.razorpay_payment_id);

                    },

                    },

                        ondismiss: function() {
                            setIsLoading(false);
                        }
                    }
                };

                rzp1.open();
            };

            return (
                <button onClick={displayRazorpay} disabled={isLoading} className={`bg-earth-green text-white py-3 px-8 rounded-full font-semibold text-lg hover:bg-opacity-90 transition shadow-lg flex justify-center items-center disabled:opacity-75 ${className}`}>
                    {isLoading ? (
                        <>
                            <svg className="animate-spin-slow -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                                <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle>
                                <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                            </svg>
                            Processing...
                        </>
                    ) : (

        };
        
        const Header = ({ navigateTo, user, userData }) => (
            <header className="bg-earth-light sticky top-0 z-50 shadow-sm">
                <div className="container mx-auto px-6 py-4 flex justify-between items-center">
                    <a href="#" onClick={navigateTo('home')} className="text-2xl font-serif font-bold text-earth-dark">Goodness of Earth</a>

        const MonthlyGraph = ({ grid }) => {
            const [graphData, setGraphData] = useState([]);

            useEffect(() => {
                const today = new Date();
                const year = today.getFullYear();
                const month = today.getMonth();
                const daysInMonth = new Date(year, month + 1, 0).getDate();
                
                const data = nutrientsList.map(nutrient => {
                    let count = 0;
                    for (let day = 1; day <= daysInMonth; day++) {
                        const dateKey = new Date(year, month, day).toISOString().split('T')[0];
                        if (grid[dateKey]?.[nutrient.name]) {
                            count++;
                        }
                    }
                    return {
                        name: nutrient.name,
                        percentage: Math.round((count / daysInMonth) * 100),
                        color: nutrient.color
                    };
                });
                setGraphData(data);
            }, [grid]);

            return (
                <section className="py-20 bg-white">

            const [phone, setPhone] = useState('');
            const [error, setError] = useState('');
            const [isLoading, setIsLoading] = useState(false);

            const handleSubmit = async (e) => { 
                e.preventDefault(); 
                setError('');

                try {
                    const userCredential = await auth.createUserWithEmailAndPassword(email, password);
                    await onSignUp(name, email, phone, userCredential.user.uid);
                } catch (err) {

            return (

                            </div>
                            <div>

                                <input type="email" placeholder="Email Address" value={email} onChange={(e) => setEmail(e.target.value)} className="w-full mt-1 p-3 border rounded-lg bg-gray-50 focus:outline-none focus:ring-2 focus:ring-earth-green" required disabled={isLoading} />
                            </div>
                            <div>

                                <input type="tel" placeholder="Phone Number" value={phone} onChange={(e) => setPhone(e.target.value)} className="w-full mt-1 p-3 border rounded-lg bg-gray-50 focus:outline-none focus:ring-2 focus:ring-earth-green" required disabled={isLoading} />
                            </div>
                            <div>
                                <label className="font-semibold text-gray-700">Password</label>
                                <input type="password" placeholder="Password" value={password} onChange={(e) => setPassword(e.target.value)} className="w-full mt-1 p-3 border rounded-lg bg-gray-50 focus:outline-none focus:ring-2 focus:ring-earth-green" required disabled={isLoading} />
                            </div>
                            <button type="submit" className="w-full bg-earth-green text-white py-3 px-8 rounded-full font-semibold text-lg hover:bg-opacity-90 transition shadow-lg flex justify-center items-center disabled:opacity-75" disabled={isLoading}>
                                {isLoading ? (
                                    <>
                                        <svg className="animate-spin-slow -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                                            <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle>
                                            <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                                        </svg>

                                    'Create Free Account'
                                )}
                            </button>

            );
        };

        const OnboardingPage = ({ navigateTo }) => {
            const [showChallenge, setShowChallenge] = useState(true);

            const startChallenge = () => {
                alert("Great! Your 48-day challenge starts now. Let's do this!");
                navigateTo('challenge-tracker')();

            if (showChallenge) {
                return (

        const NutrientSummary = ({ grid, selectedDate }) => {
            if (!selectedDate) return null;
            const dateKey = selectedDate.toISOString().split('T')[0];
            const summaryData = nutrientsList.map(nutrient => ({
                name: nutrient.name,
                percentage: (grid[dateKey]?.[nutrient.name] || false) ? 100 : 0

            return (
                <div className="tracker-preview p-8 mt-12">

                    <div className="grid md:grid-cols-3 lg:grid-cols-7 gap-6">
                        {summaryData.map(item => (
                            <div key={item.name} className="text-center">
                                <div className="relative w-24 h-24 md:w-32 md:h-32 mx-auto">
                                    <svg className="w-full h-full" viewBox="0 0 36 36">
                                        <path className="text-gray-200" strokeWidth="3" fill="none" d="M18 2.0845a 15.9155 15.9155 0 0 1 0 31.831a 15.9155 15.9155 0 0 1 0 -31.831" />

                const unsubscribe = auth.onAuthStateChanged(async (currentUser) => {
                    if (currentUser) {
                        const isNewUser = currentUser.metadata.creationTime === currentUser.metadata.lastSignInTime;
                        setUser(currentUser);
                        if (!currentUser.isAnonymous) {
                            const profileDocRef = db.collection(`artifacts/${appId}/users`).doc(currentUser.uid).collection('profile').doc('main');
                            const profileSnap = await profileDocRef.get();
                            if (profileSnap.exists) {
                                setUserData(profileSnap.data());
                                if(isNewUser) {
                                    const quote = motivationalQuotes[Math.floor(Math.random() * motivationalQuotes.length)];
                                    setWelcomeMessage("Welcome to Goodness of Earth!\n\n" + quote);
                                }
                            }
                            
                            const trackerDocRef = db.collection(`artifacts/${appId}/users`).doc(currentUser.uid).collection('trackerData').doc('main');
                            trackerDocRef.onSnapshot((docSnap) => {
                                if (docSnap.exists) setGrid(docSnap.data().grid || {});
                            });
                        }
                    } else {
                        try {
                            await auth.signInAnonymously();
                        } catch (error) { console.error("Authentication failed:", error); }
                    }
                    setAuthReady(true);
                });
                return () => unsubscribe();
            }, []);

            const debouncedGrid = useDebounce(grid, 2000);

            useEffect(() => {
                if (!user || user.isAnonymous || Object.keys(debouncedGrid).length === 0) return;
                const docRef = db.collection(`artifacts/${appId}/users`).doc(user.uid).collection('trackerData').doc('main');
                docRef.set({ grid: debouncedGrid }, { merge: true }).catch(err => console.error("Error saving data:", err));
            }, [debouncedGrid, user]);

            const navigateTo = (page) => (e) => {
                if (e) e.preventDefault();
                setCurrentPage(page);
            };

            const handleSignUp = async (name, email, phone, uid) => {
                const profileData = { name, email, phone, isSubscribed: false, hasFreeAccess: true }; // Give free access on signup
                const userDocRef = db.collection(`artifacts/${appId}/users`).doc(uid).collection('profile').doc('main');
                await userDocRef.set(profileData);
                // The onAuthStateChanged listener will handle the welcome message and data loading.
                navigateTo('home')();
            };
            
            if (!authReady) {
                return <LoadingIndicator />;
            }

            const renderPage = () => {
                switch (currentPage) {
                    case 'signup': return <SignUpPage navigateTo={navigateTo} onSignUp={handleSignUp} />;
                    case 'onboarding': return <OnboardingPage navigateTo={navigateTo} />;
                    case 'dashboard': return <DashboardHubPage navigateTo={navigateTo} />;
                    case 'nutrient-tracker': return <NutrientTrackerPage navigateTo={navigateTo} userData={userData} user={user} grid={grid} setGrid={setGrid} />;
                    case 'challenge-tracker': return <ChallengeTracker navigateTo={navigateTo} user={user} userData={userData} />;
                    case 'shop': return <ShopPage navigateTo={navigateTo} userData={userData} />;
                    case 'subscription': return <SubscriptionPage navigateTo={navigateTo} userData={userData} />;
                    default: return <HomePage navigateTo={navigateTo} user={user} grid={grid} />;
                }
            };

            return (
                <div className="font-sans bg-earth-light">
                    {welcomeMessage && <WelcomeModal message={welcomeMessage} onClose={() => setWelcomeMessage(null)} />}
                    <Header navigateTo={navigateTo} user={user} userData={userData} />
                    <main>{renderPage()}</main>
                    <Footer navigateTo={navigateTo} />
                </div>
            );
        };

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

</body>
</html>
